<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>ZeloteZ Rooms</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/watch-party.css">
  <link rel="stylesheet" href="/guest.css">
  <link rel="stylesheet" href="/watch-cinema.css">
  <link rel="stylesheet" href="/quick-chat.css">
  <script type="module" src="/guest.js"></script>
</head>
<body class="guest-page">
  <header class="site-header">
    <div class="page-width bar">
      <div class="wordmark">
        <span class="brand-icon" aria-hidden="true"></span><span>ZeloteZ <span class="wordmark-detail">Rooms</span></span>
      </div>
      <label id="guest-language-label" class="sr-only" for="guest-language">Language</label>
      <select id="guest-language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>
  <main class="page-width" id="guest-view" tabindex="-1">
    <p class="status" role="status">Opening live room…</p>
    <noscript><p class="panel">Enable JavaScript to watch this live room.</p></noscript>
  </main>
</body>
</html>
