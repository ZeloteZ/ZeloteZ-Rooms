<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>ZeloteZ Rooms</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/rooms-icon.svg" sizes="any" media="(prefers-reduced-motion: reduce)">
  <link rel="icon" type="image/svg+xml" href="/rooms-icon-animated.svg" sizes="any" media="(prefers-reduced-motion: no-preference)">
  <link rel="apple-touch-icon" href="/rooms-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/watch-party.css">
  <link rel="stylesheet" href="/guest.css">
  <link rel="stylesheet" href="/view-sidebar.css">
  <link rel="stylesheet" href="/watch-cinema.css">
  <link rel="stylesheet" href="/quick-chat.css">
  <link rel="stylesheet" href="/site-version.css">
  <script type="module" src="/guest.js"></script>
</head>
<body class="guest-page">
  <header class="site-header">
    <div class="page-width bar">
      <div class="wordmark">
        <picture class="brand-icon" aria-hidden="true">
          <source type="image/svg+xml" srcset="/rooms-icon.svg" media="(prefers-reduced-motion: reduce)">
          <source type="image/svg+xml" srcset="/rooms-icon-animated.svg">
          <img src="/rooms-icon.png" width="34" height="34" alt="">
        </picture><span>ZeloteZ <span class="wordmark-detail">Rooms</span></span>
      </div>
      <label id="guest-language-label" class="sr-only" for="guest-language">Language</label>
      <select id="guest-language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>
  <main class="page-width" id="guest-view" tabindex="-1">
    <p class="status" role="status">Opening live room…</p>
    <noscript><p class="panel">Enable JavaScript to watch this live room.</p></noscript>
  </main>
  <small id="site-version" class="site-version" hidden></small>
</body>
</html>
