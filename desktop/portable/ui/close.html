<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-src 'none'; object-src 'none'; form-action 'none'">
    <title>ZeloteZ Rooms</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="close.css">
    <script src="close.js" defer></script>
  </head>
  <body>
    <main class="close-dialog" role="dialog" aria-modal="true" aria-labelledby="close-title" aria-describedby="close-detail close-reopen" hidden>
      <div class="close-top">
        <picture><source srcset="icon.png" media="(prefers-reduced-motion: reduce)"><img class="close-logo" src="logo.svg" width="40" height="40" alt=""></picture>
        <button class="close-dismiss" type="button" id="close-dismiss"></button>
      </div>
      <section class="close-copy">
        <h1 id="close-title"></h1>
        <p id="close-detail"></p>
        <p class="close-reopen" id="close-reopen"></p>
      </section>
      <div class="close-footer">
        <label class="close-option" for="close-suppress">
          <input id="close-suppress" type="checkbox"><span id="close-option-label"></span>
        </label>
        <div class="close-actions">
          <button id="close-quit" class="close-quit" type="button"></button>
          <button id="close-confirm" class="primary" type="button">OK</button>
        </div>
      </div>
    </main>
  </body>
</html>
