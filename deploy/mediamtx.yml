logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://server:8081/internal/media-auth
authHTTPExclude: []

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false
# FFmpeg reads and publishes the browser relay over this container-local listener.
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
srt: false
moq: false

rtmp: true
rtmpEncryption: strict
rtmpAddress: :1935
rtmpsAddress: :1936
rtmpServerCert: /tls/fullchain.pem
rtmpServerKey: /tls/privkey.pem

hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
# Use full fMP4 segments for native players on HTTPS proxies without HTTP/2.
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 16M
hlsAllowOrigins: []

paths:
  '~^browser/([a-f0-9]{32})$':
    source: publisher
    overridePublisher: false
    record: false
    # Preserve the H.264 video and convert an optional Opus track for Apple HLS players.
    runOnOnline: >-
      ffmpeg -hide_banner -nostdin -loglevel warning
      -rtsp_transport tcp -timeout 5000000 -i rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
      -map 0:v:0 -map 0:a:0? -c:v copy -c:a aac -profile:a aac_low -ar 48000 -ac 2 -b:a 128k
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/live/$G1
    runOnOnlineRestart: true
  '~^live/[a-f0-9]{32}$':
    source: publisher
    overridePublisher: false
    record: false
  '~^rtc/([a-f0-9]{32})$':
    source: publisher
    overridePublisher: false
    record: false
    # The native RTMPS feed uses AAC. Convert audio only when a WebRTC player requests it.
    runOnDemand: >-
      ffmpeg -hide_banner -nostdin -loglevel warning
      -rtsp_transport tcp -timeout 5000000 -i rtsp://127.0.0.1:$RTSP_PORT/live/$G1
      -map 0:v:0 -map 0:a:0? -c:v copy -c:a libopus -ar 48000 -ac 2 -b:a 96k
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/rtc/$G1
    runOnDemandRestart: true
    runOnDemandStartTimeout: 7s
    runOnDemandCloseAfter: 5s
  '~^voice/[a-f0-9]{32}$':
    source: publisher
    overridePublisher: false
    maxReaders: 16
    record: false
