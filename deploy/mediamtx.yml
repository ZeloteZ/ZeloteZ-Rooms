logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://server:8081/internal/media-auth
authHTTPExclude: []

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false
rtsp: false
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
srt: false
moq: false

rtmp: true
rtmpEncryption: strict
rtmpAddress: :1935
rtmpsAddress: :1936
rtmpServerCert: /tls/fullchain.pem
rtmpServerKey: /tls/privkey.pem

hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
# Use full fMP4 segments for native players on HTTPS proxies without HTTP/2.
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 16M
hlsAllowOrigins: []

paths:
  '~^live/[a-f0-9]{32}$':
    source: publisher
    overridePublisher: false
    record: false
  '~^voice/[a-f0-9]{32}$':
    source: publisher
    overridePublisher: false
    maxReaders: 16
    record: false
