worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;

    log_format routes '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout routes;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The loopback-bound gateway receives this header from the outer proxy, which overwrites it.
    map $http_x_real_ip $auth_client_address {
        "" $remote_addr;
        default $http_x_real_ip;
    }
    limit_req_zone $auth_client_address zone=auth_per_client:1m rate=2r/s;
    limit_req_status 429;

    upstream chat_api {
        zone chat_api 64k;
        server server:8080 resolve;
    }

    upstream live_media {
        zone live_media 64k;
        server mediamtx:8888 resolve;
    }

    server {
        listen 8080;
        root /srv/www;
        index index.html;
        absolute_redirect off;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), display-capture=(self)" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;

        location = /health {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://chat_api/api/health;
        }

        location = /api/health { return 404; }

        location ~ "^/api/auth/(?:login|register)$" {
            limit_req zone=auth_per_client burst=12 nodelay;
            proxy_pass http://chat_api;
            proxy_read_timeout 15s;
        }

        location ~ "^/api/channels/[a-f0-9-]{36}/files/[a-f0-9-]{36}$" {
            client_max_body_size 13m;
            proxy_request_buffering off;
            proxy_pass http://chat_api;
        }

        location ~ "^/api/(?:profile/avatar|topics/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/appearance/(?:cover|banner|background))$" {
            client_max_body_size 8m;
            proxy_request_buffering off;
            proxy_pass http://chat_api;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass http://chat_api;
            proxy_read_timeout 30s;
        }

        location = /_internal/stream-view {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Stream-ID $selected_stream_id;
            proxy_pass http://chat_api/_internal/stream-view;
        }

        # MediaMTX emits both .mp4 and .mp for fragmented low-latency media.
        location ~ "^/hls/live/(?<stream_id>[a-f0-9]{32})/[A-Za-z0-9_.-]+\.(m3u8|mp4?)$" {
            limit_except GET { deny all; }
            set $selected_stream_id $stream_id;
            auth_request /_internal/stream-view;
            # MediaMTX's cookie probe is redundant because this proxy strips its cookies.
            rewrite "^/hls(/live/[a-f0-9]{32}/index\.m3u8)$" $1?cookieCheck=1? break;
            rewrite ^/hls(/.*)$ $1 break;
            proxy_pass http://live_media;
            proxy_redirect / /hls/;
            proxy_read_timeout 15s;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            add_header_inherit merge;
            add_header Cache-Control "private, no-store" always;
        }

        location /hls/ { return 404; }
        location /internal/ { return 404; }
        location /_internal/ { return 404; }
        location ~ /\. { return 404; }

        location = /index.html {
            add_header_inherit merge;
            add_header Cache-Control "no-cache" always;
            add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT" always;
        }

        location ~ "^/assets/[a-f0-9]{32}/[A-Za-z][A-Za-z0-9_.-]*\.(css|js)$" {
            add_header_inherit merge;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /assets/ { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
